[project]
name = "agentic-rag-helpdesk"
version = "0.1.0"
description = "An agentic RAG help desk agent that checks accounts and devices and escalates with tickets"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "fastembed>=0.3",
    "anthropic>=0.40",
    "openai>=1.40",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
