# Settings for run.py. Edit the values below, save, and run: uv run run.py check

[model]
# Where answers come from.
#   local  = a model on your own machine (Ollama, LM Studio, llama.cpp). No API key needed.
#   claude = the Claude API. Requires the ANTHROPIC_API_KEY environment variable.
provider = local

# Address of your local model server. Only used when provider = local.
#   Ollama:    http://localhost:11434/v1
#   LM Studio: http://localhost:1234/v1
base_url = http://localhost:11434/v1

# Model name exactly as your server lists it. Run "uv run run.py check" to see the names.
# The agent needs a model that supports tool calling, such as qwen2.5, llama3.1, or mistral-nemo.
# Leave blank to use the default (qwen2.5:7b for local, claude-sonnet-5-5 for claude).
model = qwen2.5:7b

[knowledge_base]
# Folder of .md or .txt runbooks to search. Point this at your own documents if you like.
docs = data/kb

# How documents are embedded.
#   fastembed = real semantic search with a small local model (downloads once, about 70 MB)
#   tfidf     = keyword matching, no download
embedding = fastembed

[agent]
# Most tool calls the agent may make before it gives up and suggests a ticket.
max_steps = 8

# Show every tool call the agent makes (true or false).
trace = true
